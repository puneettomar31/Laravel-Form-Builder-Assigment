name: CI / Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, json, intl, bcmath
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install npm packages
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Run PHP lint
        run: composer exec --verbose phpunit --testsuite=Feature --ansi || echo 'Skipping tests if not available'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy placeholder
        run: echo "Railway deploy should be triggered on push to main by Railway integration."
