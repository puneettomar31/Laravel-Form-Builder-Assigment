version: '3.8'

services:
  app:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel_form_builder
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      OPENAI_API_KEY: ''
      OPENAI_MODEL: gpt-4o-mini
      FILESYSTEM_DISK: public
    depends_on:
      - db
    command: sh -c "php artisan migrate --force && php artisan db:seed --class=FormSeeder --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_form_builder
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  queue:
    build: .
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel_form_builder
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      OPENAI_API_KEY: ''
      OPENAI_MODEL: gpt-4o-mini
      FILESYSTEM_DISK: public
    depends_on:
      - db
    command: php artisan queue:work --sleep=3 --tries=3

volumes:
  db_data:
